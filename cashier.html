<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#0f5c56"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="/cashier.webmanifest">
<title>تایید درخواست‌های ویزیت — صندوقدار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2b2a;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dcd6c8;
    --teal:#0f5c56;
    --teal-deep:#0a3f3b;
    --amber:#c98a2c;
    --danger:#a63d33;
    --success:#1e7a52;
    --muted:#7a8482;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Vazirmatn', Tahoma, sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:880px;margin:0 auto;}

  .head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    border-bottom:2px solid var(--teal-deep);
    padding-bottom:16px;
  }
  .head h1{font-size:22px;font-weight:800;margin:0;color:var(--teal-deep);letter-spacing:-0.3px;}
  .head .tag{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500;}
  .badge-num{font-family:'Vazirmatn';font-weight:700;font-size:13px;background:var(--teal-deep);color:#fff;padding:6px 14px;border-radius:100px;white-space:nowrap;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 1px 2px rgba(20,40,38,0.04);
  }

  /* ---- login gate ---- */
  #loginBox{max-width:380px;margin:60px auto;}
  #loginBox h2{font-size:15px;font-weight:700;color:var(--teal-deep);margin:0 0 14px;text-align:center;}
  #loginBox input{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:15px;margin-bottom:10px;text-align:center;letter-spacing:2px;
  }
  #loginBox input:focus{outline:none;border-color:var(--teal);}
  #loginErr{color:var(--danger);font-size:12.5px;text-align:center;min-height:16px;margin-bottom:6px;}

  button.act{font-family:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;width:100%;}
  .btn-main{background:var(--teal-deep);color:#fff;}
  .btn-main:hover{background:var(--teal);}
  .btn-main:disabled{background:#b8bcb9;cursor:not-allowed;}
